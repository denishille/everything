<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spielbrudis</title>
<meta name="description" content="Sonstige tägliche Rätsel: Bei Wordplay das gesuchte Wort erraten — je kleiner die Zahl, desto näher die Bedeutung.">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Spielbrudis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-text">Spielbrudis</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="word" role="tab">Wordplay</button>
  </nav>
  <div class="top-actions">
    <a class="icon-btn" href="../" title="Weiter zu Geobrudis" aria-label="Weiter zu Geobrudis"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15 0 18M12 3c-2.5 2.7-2.5 15 0 18"/></svg></a>
    <button class="icon-btn" id="btn-stats" title="Statistik" aria-label="Statistik"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
  </div>
</header>

<main>
  <!-- ================= Wordplay ================= -->
  <section id="view-word" class="view active">
    <div class="view-head">
      <div>
        <h1 class="display"><span id="word-num" class="num"></span>Wordplay</h1>
        <p class="sub">Errate das Wort. Je kleiner die Zahl, desto näher die Bedeutung.</p>
      </div>
      <div class="nav" aria-label="Rätsel-Navigation">
        <select class="nav-pick nav-filter" id="word-filter" aria-label="Filter">
          <option value="all">Alle</option>
          <option value="solved">Gelöst</option>
          <option value="open">Ungelöst</option>
        </select>
        <button class="nav-btn" id="word-prev" aria-label="Vorheriges Rätsel">‹</button>
        <select class="nav-pick" id="word-pick" aria-label="Rätsel wählen"></select>
        <button class="nav-btn" id="word-next" aria-label="Nächstes Rätsel">›</button>
      </div>
    </div>

    <form id="word-form" class="guess-form" autocomplete="off" role="search">
      <div class="combo">
        <input id="word-input" type="search" name="w" placeholder="lädt …" aria-label="Wort" disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" data-lpignore="true" data-1p-ignore data-form-type="other">
      </div>
      <button type="submit" class="primary" id="word-btn" disabled>Raten</button>
      <button type="button" class="ghost" id="word-tip" disabled>Tipp</button>
      <button type="button" class="ghost" id="word-give" disabled>Auflösen</button>
    </form>

    <div id="word-list" class="wordlist"></div>

    <div id="word-result" class="result" hidden></div>
  </section>
</main>

<!-- Modals -->
<div class="modal" id="modal-stats" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <div id="stats-content"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
