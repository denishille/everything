<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pokebrudis</title>
<meta name="description" content="Drei tägliche Pokémon-Rätsel: Errate das geheime Pokémon, finde seine stärkste Kategorie und das gesuchte Pokémon nach Ähnlichkeit.">
<link rel="icon" href="sprites/4.png" sizes="96x96">
<link rel="apple-touch-icon" href="sprites/4.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Pokebrudis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-text">Pokebrudis</span></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="find" role="tab">PokeFind</button>
    <button class="tab" data-view="play" role="tab">PokePlay</button>
  </nav>
  <div class="top-actions">
    <a class="icon-btn" href="../spiele/" title="Weiter zu Spielbrudis" aria-label="Weiter zu Spielbrudis"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor" stroke="none"/></svg></a>
    <button class="icon-btn" id="btn-stats" title="Statistik" aria-label="Statistik"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
  </div>
</header>

<main>
  <!-- ================= PokeFind ================= -->
  <section id="view-find" class="view active">
    <div class="view-head">
      <div>
        <h1 class="display"><span id="find-num" class="num"></span>PokeFind</h1>
        <p class="sub">Errate das geheime Pokémon in 10 Versuchen.</p>
      </div>
      <div class="nav" aria-label="Rätsel-Navigation">
        <select class="nav-pick nav-filter" id="find-filter" aria-label="Filter">
          <option value="all">Alle</option>
          <option value="solved">Gelöst</option>
          <option value="open">Ungelöst</option>
        </select>
        <button class="nav-btn" id="find-prev" aria-label="Vorheriges Rätsel">‹</button>
        <select class="nav-pick" id="find-pick" aria-label="Rätsel wählen"></select>
        <button class="nav-btn" id="find-next" aria-label="Nächstes Rätsel">›</button>
      </div>
    </div>

    <form id="find-form" class="guess-form" autocomplete="off" role="search">
      <div class="combo">
        <input id="find-input" type="search" name="q" placeholder="Pokémon eingeben …" aria-label="Tipp" role="combobox" aria-autocomplete="list" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" data-lpignore="true" data-1p-ignore data-form-type="other">
        <ul id="find-suggest" class="suggest" hidden></ul>
      </div>
      <button type="submit" class="primary" id="find-btn">Raten</button>
    </form>
    <div class="legend">
      <span><i class="sq ok"></i> Schwarz = richtig</span>
      <span><i class="sq miss"></i> Grau = daneben</span>
    </div>

    <details class="dex" id="find-dex">
      <summary>Alle 150 Pokémon</summary>
      <div class="dex-grid" id="find-dex-grid"></div>
    </details>

    <div id="find-result" class="result" hidden></div>

    <div id="find-guesses" class="guesses"></div>
  </section>

  <!-- ================= PokePlay ================= -->
  <section id="view-play" class="view">
    <div class="view-head">
      <div>
        <h1 class="display"><span id="play-num" class="num"></span>PokePlay</h1>
        <p class="sub">Errate das Pokémon. Je kleiner die Zahl, desto ähnlicher ist dein Tipp.</p>
      </div>
      <div class="nav" aria-label="Rätsel-Navigation">
        <select class="nav-pick nav-filter" id="play-filter" aria-label="Filter">
          <option value="all">Alle</option>
          <option value="solved">Gelöst</option>
          <option value="open">Ungelöst</option>
        </select>
        <button class="nav-btn" id="play-prev" aria-label="Vorheriges Rätsel">‹</button>
        <select class="nav-pick" id="play-pick" aria-label="Rätsel wählen"></select>
        <button class="nav-btn" id="play-next" aria-label="Nächstes Rätsel">›</button>
      </div>
    </div>

    <form id="play-form" class="guess-form" autocomplete="off" role="search">
      <div class="combo">
        <input id="play-input" type="search" name="p" placeholder="Pokémon eingeben …" aria-label="Pokémon" role="combobox" aria-autocomplete="list" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" data-lpignore="true" data-1p-ignore data-form-type="other">
        <ul id="play-suggest" class="suggest" hidden></ul>
      </div>
      <button type="submit" class="primary" id="play-btn">Raten</button>
      <button type="button" class="ghost" id="play-tip">Tipp</button>
      <button type="button" class="ghost" id="play-give">Auflösen</button>
    </form>

    <div id="play-list" class="wordlist"></div>

    <div id="play-result" class="result" hidden></div>
  </section>
</main>

<!-- Modals -->
<div class="modal" id="modal-stats" hidden>
  <div class="modal-box">
    <button class="modal-close" data-close>✕</button>
    <div id="stats-content"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
